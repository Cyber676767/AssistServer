<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AssistBot Status</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#111214;--sidebar:#1e1f22;--card:#2b2d31;--card2:#232428;
      --hover:#2e3035;--input:#1e1f22;--border:#3a3c40;
      --text:#dbdee1;--muted:#949ba4;--faint:#6d6f78;
      --green:#23a55a;--gdim:rgba(35,165,90,.15);
      --yellow:#f0b132;--ydim:rgba(240,177,50,.15);
      --red:#f23f43;--rdim:rgba(242,63,67,.15);
      --blurple:#5865f2;--bdim:rgba(88,101,242,.2);
      --r:6px;--rl:8px;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
    .layout{display:flex;min-height:100vh}

    /* Sidebar */
    .sidebar{width:232px;min-width:232px;background:var(--sidebar);display:flex;flex-direction:column;border-right:1px solid var(--border)}
    .sb-logo{padding:14px 14px 8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .sb-logo img{height:18px}
    .sb-section{padding:8px 0}
    .sb-label{padding:8px 16px 4px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
    .nav-item{display:flex;align-items:center;gap:8px;padding:7px 12px;margin:1px 8px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--muted);cursor:pointer;transition:all .1s;text-decoration:none}
    .nav-item:hover{background:rgba(255,255,255,.06);color:var(--text)}
    .nav-item.active{background:rgba(88,101,242,.25);color:#c5c9f8;font-weight:600}
    .ndot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
    .ndot.up{background:var(--green)}.ndot.down{background:var(--red)}.ndot.unknown{background:var(--faint)}.ndot.paused{background:var(--yellow)}
    
    /* Discord Styled Footer Profile */
    .sb-footer{margin-top:auto;background:#232428;border-top:1px solid var(--border);padding:10px 8px;display:flex;align-items:center;gap:8px}
    .av{width:32px;height:32px;border-radius:50%;background:#111214;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;border:1px solid var(--border)}
    .av img{width:20px;height:20px;object-fit:contain}
    .av::after{content:'';position:absolute;bottom:-2px;right:-2px;width:10px;height:10px;background:var(--green);border-radius:50%;border:2px solid #232428}
    .uinfo{display:flex;flex-direction:column;line-height:1.3}
    .uname{font-size:13px;font-weight:700;color:var(--text)}
    .ustatus{font-size:11px;color:var(--muted);font-weight:400}

    /* Main Content */
    .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
    .topbar{height:48px;background:var(--card2);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:10px;flex-shrink:0}
    .tb-title{font-size:15px;font-weight:700}
    .tb-div{width:1px;height:18px;background:var(--border)}
    .tb-sub{font-size:13px;color:var(--muted);flex:1}
    .ping-pill{font-size:11px;font-weight:600;color:var(--muted);background:var(--input);border:1px solid var(--border);padding:3px 9px;border-radius:20px}
    .ping-pill span{color:var(--green)}
    @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.5)}}
    .ldot{display:inline-block;width:6px;height:6px;background:var(--green);border-radius:50%;margin-right:4px;animation:pulse 2s infinite;vertical-align:middle}

    .content{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}

    /* Banner */
    .banner{border-radius:var(--rl);padding:13px 16px;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;border:1px solid transparent;transition:all .3s}
    .banner.operational{background:var(--gdim);border-color:rgba(35,165,90,.3);color:#3fba7a}
    .banner.degraded{background:var(--ydim);border-color:rgba(240,177,50,.3);color:var(--yellow)}
    .banner.outage{background:var(--rdim);border-color:rgba(242,63,67,.3);color:var(--red)}

    /* Section Components */
    .sec-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-bottom:7px;padding:0 2px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:var(--rl);overflow:hidden}

    /* Monitor Rows */
    .mrow{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--border);gap:10px;transition:background .1s}
    .mrow:last-child{border-bottom:none}
    .mrow:hover{background:var(--hover)}
    .sdot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .sdot.up{background:var(--green);box-shadow:0 0 0 3px rgba(35,165,90,.2)}
    .sdot.down{background:var(--red);box-shadow:0 0 0 3px rgba(242,63,67,.2)}
    .sdot.paused{background:var(--yellow);box-shadow:0 0 0 3px rgba(240,177,50,.2)}
    .sdot.unknown{background:var(--faint)}
    .mname{font-weight:600;font-size:14px;flex:1;color:var(--text)}
    .mup{font-size:12px;color:var(--muted);font-weight:500;min-width:44px;text-align:right}
    .badge{font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
    .badge.up{background:var(--gdim);color:var(--green)}
    .badge.down{background:var(--rdim);color:var(--red)}
    .badge.paused{background:var(--ydim);color:var(--yellow)}
    .badge.unknown{background:rgba(109,111,120,.2);color:var(--faint)}
    .badge.operational{background:var(--gdim);color:var(--green)}
    .badge.degraded_performance{background:var(--ydim);color:var(--yellow)}
    .badge.partial_outage{background:var(--ydim);color:var(--yellow)}
    .badge.major_outage{background:var(--rdim);color:var(--red)}
    .bars{display:flex;gap:2px;align-items:center}
    .bar{width:4px;height:18px;border-radius:2px;background:var(--border)}
    .bar.up{background:var(--green)}.bar.down{background:var(--red)}

    /* Layout Grids */
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

    /* Incidents Rows */
    .inc-row{padding:12px 14px;border-bottom:1px solid var(--border)}
    .inc-row:last-child{border-bottom:none}
    .inc-date{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
    .inc-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:4px}
    .inc-body{font-size:12px;color:var(--muted);line-height:1.5}
    .inc-status{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em;margin-right:6px}
    .inc-status.resolved{background:var(--gdim);color:var(--green)}
    .inc-status.identified{background:var(--ydim);color:var(--yellow)}
    .inc-status.investigating{background:var(--bdim);color:#8891f2}
    .inc-status.monitoring{background:var(--bdim);color:#8891f2}

    /* Custom Admin Inputs Form */
    .update-form{padding:14px}
    .update-form textarea{width:100%;background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:13px;padding:10px 12px;resize:vertical;min-height:70px;outline:none;transition:border .15s}
    .update-form textarea:focus{border-color:var(--blurple)}
    .update-form textarea::placeholder{color:var(--faint)}
    .form-row{display:flex;gap:8px;margin-top:8px;align-items:center}
    .sel{background:var(--input);border:1px solid var(--border);border-radius:var(--r);color:var(--text);font-family:inherit;font-size:12px;padding:6px 10px;outline:none;cursor:pointer}
    .sel:focus{border-color:var(--blurple)}
    .post-btn{background:var(--blurple);border:none;border-radius:var(--r);color:white;font-family:inherit;font-size:13px;font-weight:700;padding:7px 18px;cursor:pointer;transition:filter .15s;margin-left:auto}
    .post-btn:hover{filter:brightness(1.15)}

    /* Realtime Activity Logging UI Components */
    .lrow{display:flex;align-items:center;padding:9px 14px;border-bottom:1px solid var(--border);gap:10px;font-size:12px;transition:background .1s}
    .lrow:last-child{border-bottom:none}
    .lrow:hover{background:var(--hover)}
    .ltype{font-size:10px;font-weight:800;padding:2px 7px;border-radius:3px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;min-width:80px;text-align:center}
    .ltype.check{background:var(--bdim);color:#8891f2}
    .ltype.up{background:var(--gdim);color:var(--green)}
    .ltype.down{background:var(--rdim);color:var(--red)}
    .lmsg{flex:1;color:var(--muted)}.lmsg strong{color:var(--text);font-weight:600}
    .ltime{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}

    /* Bottom Control Bar Area */
    .footer{padding:9px 16px;border-top:1px solid var(--border);background:var(--card2);display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--faint);flex-shrink:0}
    .rbtn{background:var(--input);border:1px solid var(--border);border-radius:var(--r);padding:5px 14px;font-size:12px;font-family:inherit;color:var(--muted);cursor:pointer;font-weight:700;transition:all .15s}
    .rbtn:hover{background:var(--card);color:var(--text)}.rbtn:disabled{opacity:.4;cursor:not-allowed}

    /* Content Pending Skeleton Placeholders */
    .sk{background:linear-gradient(90deg,var(--border) 25%,#3f4146 50%,var(--border) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:3px}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .sk-row{display:flex;align-items:center;padding:10px 14px;gap:10px;border-bottom:1px solid var(--border)}
    .sk-row:last-child{border-bottom:none}

    #countdown{font-variant-numeric:tabular-nums}
    @media(max-width:640px){.sidebar{display:none}.grid2{grid-template-columns:1fr}.bars{display:none}}
  </style>
</head>
<body>
<div class="layout">

  <div class="sidebar">
    <div class="sb-logo">
      <img src="https://i.imgur.com/E0X7G70.png" alt="Discord Logo" style="height: 16px; width: auto; filter: brightness(0) invert(1);">
      <span style="font-size:13px;font-weight:700;color:var(--text);margin-left:2px">AssistBot Status</span>
    </div>
    <div class="sb-section">
      <div class="sb-label">My Services</div>
      <div id="nav-items">
        <div class="nav-item"><div class="ndot unknown"></div>Loading…</div>
      </div>
    </div>
    <div class="sb-section">
      <div class="sb-label">Discord</div>
      <div id="discord-nav">
        <div class="nav-item"><div class="ndot unknown"></div>Fetching…</div>
      </div>
    </div>
    
    <div class="sb-footer">
      <div class="av">
        <img src="https://i.imgur.com/E0X7G70.png" alt="AssistBot Profile Badge"/>
      </div>
      <div class="uinfo">
        <div class="uname">AssistBot<span style="color:var(--faint);font-weight:400;font-size:11px">#8085</span></div>
        <div class="ustatus">Online</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="topbar">
      <img src="https://i.imgur.com/E0X7G70.png" alt="Discord Status Header Badge" style="height:15px; width:auto; filter: drop-shadow(0px 1px 2px rgba(0,0,0,0.5));">
      <div class="tb-title" style="margin-left: 2px;">AssistBot</div>
      <div class="tb-div"></div>
      <div class="tb-sub" id="tb-sub">Loading…</div>
      <div class="ping-pill">Ping: <span id="ping-val">—</span> ms</div>
      <div style="font-size:12px;color:var(--faint)"><span class="ldot"></span>Live</div>
    </div>

    <div class="content">

      <div id="banner" class="banner operational">
        <span id="banner-icon">✅</span>
        <span id="banner-label">Checking status…</span>
      </div>

      <div class="grid2">
        <div>
          <div class="sec-title">My Services</div>
          <div class="card" id="monitor-list">
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:120px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:50px;height:12px"></div></div>
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:100px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:50px;height:12px"></div></div>
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:140px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:50px;height:12px"></div></div>
          </div>
        </div>

        <div>
          <div class="sec-title">Discord Status</div>
          <div class="card" id="discord-list">
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:80px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:60px;height:12px"></div></div>
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:100px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:60px;height:12px"></div></div>
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:70px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:60px;height:12px"></div></div>
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:90px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:60px;height:12px"></div></div>
            <div class="sk-row"><div class="sk" style="width:10px;height:10px;border-radius:50%"></div><div class="sk" style="width:60px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:60px;height:12px"></div></div>
          </div>
        </div>
      </div>

      <div class="grid2">
        <div>
          <div class="sec-title">Post Update</div>
          <div class="card">
            <div class="update-form">
              <textarea id="update-text" placeholder="Describe what's happening… e.g. 'Investigating elevated latency on Assistbot'"></textarea>
              <div class="form-row">
                <select class="sel" id="update-type">
                  <option value="investigating">🔍 Investigating</option>
                  <option value="identified">⚠️ Identified</option>
                  <option value="monitoring">👁 Monitoring</option>
                  <option value="resolved" selected>✅ Resolved</option>
                </select>
                <select class="sel" id="update-service">
                  <option value="All Services">All Services</option>
                  <option value="Assistbot">Assistbot</option>
                  <option value="Assistmusic">Assistmusic</option>
                  <option value="Dashboard">Dashboard</option>
                </select>
                <button class="post-btn" onclick="postUpdate()">Post</button>
              </div>
            </div>
          </div>
        </div>

        <div>
          <div class="sec-title">Incidents &amp; Updates</div>
          <div class="card" id="incident-list" style="max-height:260px;overflow-y:auto">
            <div class="sk-row"><div class="sk" style="width:60px;height:10px"></div><div style="flex:1"></div></div>
            <div class="sk-row"><div class="sk" style="width:200px;height:12px"></div></div>
          </div>
        </div>
      </div>

      <div>
        <div class="sec-title">Activity Log</div>
        <div class="card" id="log-list">
          <div class="sk-row"><div class="sk" style="width:80px;height:16px;border-radius:3px"></div><div class="sk" style="width:160px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:44px;height:12px"></div></div>
          <div class="sk-row"><div class="sk" style="width:80px;height:16px;border-radius:3px"></div><div class="sk" style="width:130px;height:12px"></div><div style="flex:1"></div><div class="sk" style="width:44px;height:12px"></div></div>
        </div>
      </div>

    </div>

    <div class="footer">
      <div>Refreshes in <span id="countdown">60</span>s &nbsp;·&nbsp; Powered by <strong style="color:var(--muted)">AssistBot</strong></div>
      <button class="rbtn" id="rbtn" onclick="manualRefresh()">↻ Refresh</button>
    </div>
  </div>
</div>

<script>
const UPTIMEROBOT_API='https://api.uptimerobot.com/v2/getMonitors';
const DISCORD_API='https://discordstatus.com/api/v2/summary.json';
const INCIDENT_API='https://discordstatus.com/api/v2/incidents.json';

let countdown=60,timer,lastFetch=0,cache=null,logs=[],customUpdates=[];

function loadUpdates(){
  try{const saved=localStorage.getItem('assistbot-updates');customUpdates=saved?JSON.parse(saved):[];}catch(e){customUpdates=[];}
}

function saveUpdates(){
  try{localStorage.setItem('assistbot-updates',JSON.stringify(customUpdates.slice(0,15)));}catch(e){}
}

const sc=s=>s===2?'up':s===9||s===8?'down':s===0?'paused':'unknown';
const sl=s=>s===2?'Operational':s===9?'Outage':s===8?'Degraded':s===0?'Paused':'Unknown';
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const now12=()=>new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});
const dateStr=d=>new Date(d).toLocaleDateString('en-US',{month:'short',day:'numeric'});

function bars(r){let h='';for(let i=0;i<32;i++){const up=((i*7+3)%100)/100<r/100;h+=`<div class="bar ${up?'up':'down'}"></div>`;}return `<div class="bars">${h}</div>`;}

function addLog(type,text){
  logs.unshift({type,text,time:now12()});
  if(logs.length>20)logs.pop();
  renderLogs();
}

function renderLogs(){
  const el=document.getElementById('log-list');
  if(!logs.length)return;
  el.innerHTML=logs.map(l=>`<div class="lrow"><div class="ltype ${l.type}">${l.type==='check'?'Status Check':l.type==='up'?'Online':'Outage'}</div><div class="lmsg">${l.text}</div><div class="ltime">${l.time}</div></div>`).join('');
}

async function fetchDiscordStatus(){
  try{
    const [s,i]=await Promise.all([fetch(DISCORD_API),fetch(INCIDENT_API)]);
    const sum=await s.json();
    const inc=await i.json();
    window._lastIncidents=inc.incidents||[];
    renderDiscord(sum,inc.incidents||[]);
  }catch(e){
    document.getElementById('discord-list').innerHTML=`<div style="padding:12px 14px;font-size:12px;color:var(--muted)">Could not fetch Discord status</div>`;
  }
}

function renderDiscord(sum,incidents){
  const keys=['API','Gateway','Media Proxy','Voice','Client'];
  const comps=sum.components.filter(c=>keys.some(k=>c.name.toLowerCase().includes(k.toLowerCase()))).slice(0,6);
  document.getElementById('discord-list').innerHTML=comps.map(c=>{
    const s=c.status;
    const dotClass=s==='operational'?'up':s==='major_outage'?'down':'paused';
    const label=s.replace(/_/g,' ').replace(/\b\w/g,l=>l.toUpperCase());
    return `<div class="mrow"><div class="sdot ${dotClass}"></div><div class="mname" style="font-size:13px">${esc(c.name)}</div><div class="badge ${s}" style="font-size:10px">${label}</div></div>`;
  }).join('');
  document.getElementById('discord-nav').innerHTML=comps.slice(0,4).map(c=>{
    const dotClass=c.status==='operational'?'up':c.status==='major_outage'?'down':'paused';
    return `<div class="nav-item"><div class="ndot ${dotClass}"></div>${esc(c.name)}</div>`;
  }).join('');
  renderIncidents(incidents);
}

function renderIncidents(incidents){
  const el=document.getElementById('incident-list');
  const all=[...customUpdates,...incidents.slice(0,5)];
  if(!all.length){el.innerHTML=`<div style="padding:14px;font-size:13px;color:var(--muted);text-align:center">No incidents reported ✓</div>`;return;}
  el.innerHTML=all.map(i=>{
    const isCustom=!!i._custom;
    const latest=isCustom?i:i.incident_updates?.[0];
    const status=isCustom?i.type:latest?.status||'resolved';
    const body=isCustom?i.body:latest?.body||'';
    const date=isCustom?i.date:dateStr(i.created_at);
    return `<div class="inc-row">
      <div class="inc-date">${date}</div>
      <div class="inc-title">${esc(isCustom?i.title:i.name)}</div>
      <div class="inc-body"><span class="inc-status ${status}">${status}</span> ${esc(body)}</div>
    </div>`;
  }).join('');
}

function postUpdate(){
  const text=document.getElementById('update-text').value.trim();
  if(!text)return;
  const type=document.getElementById('update-type').value;
  const service=document.getElementById('update-service').value;
  const time=new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
  customUpdates.unshift({_custom:true,title:`[${service}]`,type,body:text,date:time});
  saveUpdates();
  document.getElementById('update-text').value='';
  renderIncidents(window._lastIncidents||[]);
  addLog(type==='resolved'?'up':'down',`<strong>Update posted</strong> for ${esc(service)}: ${esc(text.slice(0,40))}${text.length>40?'…':''}`);
}

async function fetchStatus(force=false){
  const now=Date.now();
  if(!force && cache && (now-lastFetch)<5000){render(cache);return;}
  try{
    const monitors = await Promise.all([
      fetch(UPTIMEROBOT_API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({api_key:'m803038901-de5f8200e02d0175f3623542',format:'json',custom_uptime_ratios:'90',logs:'0'})}).then(r=>r.json()),
      fetch(UPTIMEROBOT_API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({api_key:'m803138290-466db08e8901a7e49b6ac3d5',format:'json',custom_uptime_ratios:'90',logs:'0'})}).then(r=>r.json()),
      fetch(UPTIMEROBOT_API,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({api_key:'m803121772-30a8ddf61c429ebddfca1ac0',format:'json',custom_uptime_ratios:'90',logs:'0'})}).then(r=>r.json()),
    ]);
    const m=[monitors[0].monitors[0],monitors[1].monitors[0],monitors[2].monitors[0]].map((m,i)=>({...m,friendly_name:['Assistbot','Assistmusic','Dashboard'][i]}));
    const ping=Math.round(Math.random()*50+20);
    document.getElementById('ping-val').textContent=ping;
    cache=m;lastFetch=Date.now();
    render(m);
    addLog('check',`Checked <strong>${m.length} services</strong> — ${m.filter(x=>x.status===2).length} operational`);
  }catch(err){
    if(cache){render(cache);}
    else{document.getElementById('monitor-list').innerHTML=`<div style="padding:12px 14px;color:var(--red);font-size:13px;font-weight:600">⚠️ API limit</div>`;}
  }
  resetCountdown();
}

function render(monitors){
  const allUp=monitors.every(m=>m.status===2),anyDown=monitors.some(m=>m.status===9);
  const state=allUp?'operational':anyDown?'outage':'degraded';
  const label=allUp?'All Systems Operational':anyDown?'Service Outage Detected':'Partial Service Degradation';
  document.getElementById('banner').className='banner '+state;
  document.getElementById('banner-label').textContent=label;
  document.getElementById('banner-icon').textContent=allUp?'✅':anyDown?'🔴':'⚠️';
  document.getElementById('tb-sub').textContent=label;
  document.getElementById('monitor-list').innerHTML=monitors.map(m=>{
    const s=sc(m.status),up=parseFloat(m.custom_uptime_ratio||100).toFixed(2);
    return `<div class="mrow"><div class="sdot ${s}"></div><div class="mname">${esc(m.friendly_name)}</div>${bars(parseFloat(up))}<div class="mup">${up}%</div><div class="badge ${s}">${sl(m.status)}</div></div>`;
  }).join('');
  document.getElementById('nav-items').innerHTML=monitors.map(m=>{
    const s=sc(m.status);
    return `<div class="nav-item ${s==='up'?'active':''}"><div class="ndot ${s}"></div>${esc(m.friendly_name)}</div>`;
  }).join('');
}

function manualRefresh(){fetchStatus(true);}

function resetCountdown(){
  clearInterval(timer);countdown=60;document.getElementById('countdown').textContent=countdown;
  timer=setInterval(()=>{countdown--;document.getElementById('countdown').textContent=countdown;if(countdown<=0)fetchStatus();},1000);
}

loadUpdates();
fetchStatus(true);
fetchDiscordStatus();
setInterval(fetchDiscordStatus,300000);
</script>
